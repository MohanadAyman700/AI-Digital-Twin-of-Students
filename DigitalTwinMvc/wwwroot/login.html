<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Digital Twin</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/dashboard.css"></head>
<body data-page="login"><main class="login"><div class="card">
<a class="brand" href="index.html" style="margin-bottom:18px"><i></i>Digital Twin</a>
<h1 style="font-size:24px">Log in</h1><p class="sub">Any email and password work for now.</p>
<form id="form">
<label class="f">I am a</label>
<div class="seg"><label><input type="radio" name="role" value="student" checked><span>Student</span></label><label><input type="radio" name="role" value="advisor"><span>Advisor</span></label></div>
<label class="f" for="em">University email</label><input id="em" type="email" placeholder="name@fa-hists.edu.eg" required>
<label class="f" for="pw">Password</label><input id="pw" type="password" required>
<button class="btn" style="width:100%;margin-top:20px" type="submit">Log in</button></form></div></main>
<script src="/js/dashboard-data.js"></script><script src="/js/dashboard.js"></script></body></html>
